<div [class]="classes">
    <div [class]="imageClasses">
        @if (imageUrl) {
            <img [src]="imageUrl" alt="Item image" class="w-full h-full object-cover" />
        } @else {
            <span class="text-3xl lg:text-[40px] leading-none select-none">{{
                emoji
            }}</span>
        }
    </div>
    <div class="flex flex-col gap-2 p-3 w-full">
        <h3 class="text-base font-bold text-text truncate">{{ name }}</h3>
        <div class="flex justify-between items-center">
            <app-status-badge [status]="status"></app-status-badge>
            <div class="flex items-center gap-3">
                <button type="button" (click)="remove.emit()" class="cursor-pointer">
                    <img src="/icons/trash.svg" class="size-4" alt="Delete button" />
                </button>
                <button type="button" (click)="edit.emit()" class="cursor-pointer">
                    <img src="/icons/pen.svg" class="size-4" alt="Edit button" />
                </button>
            </div>
        </div>
    </div>
</div>
