<div class="flex flex-1 flex-col gap-4 px-3">
   <h1>Page: exampleGroupList</h1>
  <a routerLink="/app/dashboard" class="text-primary underline">Dashboard</a>

  @if (errorMessage()) {
    <p class="text-error">{{ errorMessage() }}</p>
  } @else {
    @for (group of groups(); track group.id) {
      <p>{{ group.name }}</p>
    } @empty {
      <p>Aucun groupe</p>
    }
  }
</div>
