<div class="flex flex-col gap-1">

    @if (label()) {
    <label [for]="id" class="text-sm font-medium text-text">
        {{ label() }} @if (required()) {
        <span class="text-error" aria-hidden="true">*</span>
        }
    </label>
    }

    <input
        [id]="id"
        [type]="typeField()"
        [placeholder]="placeholder()"
        [value]="value()"
        (input)="onInput($event)"
		[disabled]="disabled()"
		(blur)="touch.emit()"
        [class]="classes"
    />

    @if (touched() && errors().length > 0) { @for (error of errors(); track
    error.kind) {
    <span class="text-xs text-error">{{ error.message }}</span>
    } }

</div>
