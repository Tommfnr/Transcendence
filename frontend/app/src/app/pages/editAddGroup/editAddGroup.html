<app-modal
    [title]="isEditMode() ? 'Edit your group' : 'Create a group'"
    subtitle="Bring the people close to you together in a group"
    (closed)="onCancel()"
>
    <form (submit)="onSubmit($event)" class="flex flex-col gap-4">
        @if (bannerErrors().length > 0) {
            <div class="rounded border border-red-500 bg-red-50 p-3 text-red-700">
                @for (msg of bannerErrors(); track msg) {
                    <p>{{ msg }}</p>
                }
            </div>
        }

        <div class="flex flex-wrap gap-4 ">
            <div class="size-18 bg-primary rounded-full shrink-0"></div>
            <div class="flex flex-col gap-2 min-w-40 flex-1">
                <app-text-field
                    label="Group name"
                    type="text"
                    placeholder="E.g Neighbours Bellevue, Family"
                    [formField]="groupForm.name"
                ></app-text-field>
                <!-- RAPH check here -->
                <!-- @if (groupForm.name().invalid() && groupForm.name().touched()) {
                    @for (error of groupForm.name().errors(); track error.kind) {
                        {{ error.message }}
                    }
                } -->
            </div>
            <!-- RAPH check here -->
            <!-- Name <input type="text" [formField]="groupForm.name" class="border" />
                @if (groupForm.name().invalid() && groupForm.name().touched()) {
                    @for (error of groupForm.name().errors(); track error.kind) {
                        {{ error.message }}
                    }
                } -->
        </div>

        <div>
            <app-text-field
                multiline
                label="Description (optional)"
                placeholder="What is this group for? Who can join?"
                [formField]="groupForm.description"
            ></app-text-field>
        </div>

        @if (isEditMode()) {
            <div>
                <input #targetUsernameInput placeholder="Username" class="border" />
                <app-button
                    type="button"
                    variant="secondary"
                    (click)="onAddMember(targetUsernameInput.value); targetUsernameInput.value = ''"
                    >Add Member</app-button
                >
            </div>
        }

        @if (errorMessage()) {
            <p class="text-error">{{ errorMessage() }}</p>
        }

        <button
            appButton
            block
            type="submit"
            variant="secondary"
            size="large"
            [disabled]="groupForm().invalid()"
        >
            @if (isEditMode()) {
                Save Changes
            } @else {
                Create the group
            }
        </button>
    </form>
</app-modal>
