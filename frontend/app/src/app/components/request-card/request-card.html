<article
  class="flex w-full flex-col overflow-hidden rounded-2xl bg-card shadow-[0_1px_3px_0_rgba(0,0,0,0.25)]"
>
  <div class="flex items-start gap-2 px-2.5 py-1">
    <div class="size-10 shrink-0 rounded-full bg-[#D9D9D9]/50"></div>

    <div class="flex min-w-0 flex-1 flex-col">
      <div class="flex items-center gap-2.5 px-0.5 py-0.5">
        <p class="truncate text-xs font-bold text-black">
          {{ request().authorName }}
          <span class="text-[0.6875rem] font-normal">- </span>
          <span class="text-[0.6875rem] font-normal italic">{{ request().groupName }}</span>
        </p>
        <span class="ml-auto shrink-0 text-[0.625rem] font-light tracking-[-0.2px] text-black">
          {{ request().timeAgo }}
        </span>
      </div>

      <div class="flex h-13 flex-col gap-1 overflow-hidden px-0.5">
        <h3 class="truncate text-xs font-bold text-black">{{ request().title }}</h3>
        <p class="text-[0.6875rem] text-text">{{ request().description }}</p>
      </div>
    </div>
  </div>

  <div class="flex h-[30px] items-center justify-between px-2">
    <div class="flex items-center gap-2">
      @for (tag of request().tags; track tag.label) {
        <span class="flex h-[18px] items-center gap-1 rounded bg-complementary/15 px-2">
          <img
            [src]="'/icons/' + tag.icon + '.svg'"
            [class]="tag.icon === 'tag' ? 'size-2.5' : 'size-3'"
            alt=""
          />
          <span class="whitespace-nowrap text-[0.5625rem] tracking-[-0.18px] text-black">
            {{ tag.label }}
          </span>
        </span>
      }
    </div>

    <button
      type="button"
      (click)="help.emit(request())"
      class="h-[26px] w-[83px] shrink-0 rounded-lg bg-primary text-[0.6875rem] font-bold text-background"
    >
      Je peux aider
    </button>
  </div>
</article>
