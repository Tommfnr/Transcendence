<app-title-bar title="Help and support" leading="back"></app-title-bar>

<h1 class="hidden text-lg font-bold lg:block">Help and support</h1>
<div class="flex flex-col gap-4 pt-12 lg:pt-4">
    @if (bannerErrors().length > 0) {
        <app-error-banner>
            @for (msg of bannerErrors(); track msg) {
                <p>{{ msg }}</p>
            }
        </app-error-banner>
    }

    <p>
        How to use api:
        <a
            href="https://pep.localhost:8443/api/public/docs/#/"
            class="text-complementary font-bold"
            target="_blank"
        >
            api doc</a
        >
    </p>
    <div class="w-fit">
        <button appButton block class="" (click)="generate()">Generate api key</button>
    </div>
    <div>
        @if (newKey(); as key) {
            <p class="font-bold">Here is your key. Copy it, it will not be shown again:</p>
			<div class="rounded-card bg-primary-surface w-fit p-2">
				
				<code class="select-all break-all ">{{ key }} </code>
			</div>
        }
    </div>
</div>
