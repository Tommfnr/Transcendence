<app-modal
  [title]="isEditMode() ? 'Edit Object' : 'Add Object'"
  (closed)="onCancel()"
  subtitle="Share your items to friends and family"
>
    <form (submit)="onSubmit($event)" class="flex flex-col gap-4">
        
        @if (bannerErrors().length > 0) {
        <div class="rounded border border-red-500 bg-red-50 p-3 text-red-700">
        @for (msg of bannerErrors(); track msg) {
        <p>{{ msg }}</p>
        }
        </div>
        }

        <app-text-field
            tone="white"
            label="Item name"
            placeholder="Ex: Driller, Bike..."
            typeField="text"
            [formField]="objectForm.name"
        ></app-text-field>

        <div class="flex flex-col gap-2">
            <h2 class="text-sm font-medium text-text">Category</h2>
            <div class="flex flex-wrap gap-2">
                @for (cat of categories; track cat.label) {
                <app-chip
                    [label]="cat.label"
                    [emoji]="cat.emoji"
                    [selected]="cat.label === object().type"
                    (pick)="setType(cat.label)"
                    tone="white"
                />
                }
            </div>
        </div>

        <div class="flex flex-col gap-2">
            <h2 class="text-sm font-medium text-text">State</h2>
            <div class="flex flex-wrap gap-2">
                @for (state of states; track state.label) {
                <app-chip
                    [label]="state.label"
                    [selected]="state.value === object().condition"
                    (pick)="setCondition(state.value)"
                    tone="white"
                />
                }
            </div>
        </div>
        <div>
            <app-text-field 
				multiline
				rows="3"
                tone="white"
                label="Description (optional)"
                placeholder="Ex: brand, accessories, additional information..."
                typeField="text"
                [formField]="objectForm.description"
            ></app-text-field>
        </div>

        <app-button block type="submit" variant="primary" >
            @if (isEditMode()) { Save Changes } @else { Add Object }
        </app-button>
    </form>
</app-modal>
