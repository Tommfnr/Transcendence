<div class="flex flex-1 items-start justify-center pt-8 lg:items-center lg:py-8 lg:pt-0">
	<div class="flex w-full max-w-110 flex-col gap-5 rounded-card bg-card px-5 py-6 shadow-card">
		<section class="flex flex-col gap-1">
			<h1 class="text-xl font-bold">Welcome back</h1>
			<p class="text-sm text-text-secondary">Log in to see what people close to you need</p>
		</section>

		@if (bannerErrors().length > 0) {
			<div class="rounded border border-red-500 bg-red-50 p-3 text-red-700">
				@for (msg of bannerErrors(); track msg) {
					<p>{{ msg }}</p>
				}
			</div>
		}

		<form (submit)="onSubmit($event)" class="flex flex-col gap-5">
			<app-text-field
				placeholder="john@example.com"
				label="Username or Email"
				[formField]="loginForm.identifier"
			></app-text-field>
			<app-text-field
				typeField="password"
				placeholder="••••••••"
				label="Password"
				[formField]="loginForm.password"
			></app-text-field>
			<label class="flex items-center gap-2 text-sm">
				<input type="checkbox" [formField]="loginForm.rememberMe" class="accent-primary" />
				Remember me
			</label>

			<button appButton block size="large" type="submit" variant="primary">Log in</button>
		</form>

		<p class="text-center text-sm text-text-secondary">
			No account yet? <a class="font-bold text-primary" routerLink="/register">Register</a>
		</p>
	</div>
</div>
