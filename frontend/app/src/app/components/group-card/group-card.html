    <div class="flex flex-row bg-card rounded-card p-3 gap-3 items-center shadow-card">
        <app-avatar kind="group"></app-avatar>
        <div class="flex flex-col items-start min-w-0 gap-0.5">
            <h2 class="font-bold text-base text-text">{{ name() }}</h2>
            <p class="text-sm text-text-secondary">
                {{ memberCount()}}
                @if (memberCount() === 1) {
                    <span>member</span>
                } @else {
                    <span>members</span>
                }
				· {{ role() }}
            </p>
        </div>
		<button type="button" variant="primary" aria-label="Edit group" class="ml-auto shrink-0 cursor-pointer" (click)="settings.emit()">

			<img src="/icons/settings.svg" alt="Edit" class="size-5 lg:size-6"/>
		</button>
    </div>
