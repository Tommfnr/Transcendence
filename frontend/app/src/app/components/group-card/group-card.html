<button
    type="button"
    (click)="settings.emit()"
    class="w-full flex flex-row bg-card rounded-card p-3 gap-3 items-center shadow-card hover:shadow-raised cursor-pointer text-left"
>
    <app-avatar kind="group"></app-avatar>
    <div class="flex flex-col items-start min-w-0 gap-0.5">
        <h2 class="font-bold text-base text-text">{{ name() }}</h2>
        <p class="text-sm text-text-secondary">
            {{ memberCount() }}
            @if (memberCount() === 1) {
                <span>member</span>
            } @else {
                <span>members</span>
            }
            · {{ role() }}
        </p>
    </div>
    <img
        src="/icons/settings.svg"
        alt=""
        aria-hidden="true"
        class="ml-auto shrink-0 size-5 lg:size-6"
    />
</button>
