<article
  class="flex w-full flex-col overflow-hidden rounded-card bg-card shadow-card"
>
  <div class="flex items-start gap-2 px-2 pt-2 pb-1">
    <app-avatar />

    <div class="flex min-w-0 flex-1 flex-col gap-1">
      <div class="flex items-center gap-2">
        <p class="truncate text-xs font-bold text-strong">
          {{ request().authorName }}
          <span class="text-xs font-normal">- </span>
          <span class="text-xs font-normal italic">{{ request().groupName }}</span>
        </p>
        <span class="ml-auto shrink-0 text-2xs font-light tracking-[-0.2px] text-strong
">
          {{ request().timeAgo }}
        </span>
      </div>

      <div class="flex flex-col gap-1">
        <h3 class="truncate text-xs font-bold text-strong">{{ request().title }}</h3>
        <p class="line-clamp-2 text-xs text-text">{{ request().description }}</p>
      </div>
    </div>
  </div>

  <div class="flex items-center justify-between px-2 pt-1 pb-2">
    <div class="flex items-center gap-2">
      @for (tag of request().tags; track tag.label) {
        <app-tag [label]="tag.label" [icon]="tag.icon" />
      }
    </div>

    @if (isOpen()) {
      <a
        routerLink="/app/iCanHelp"
        (click)="help.emit(request())"
        appButton
        size="xsmall"
        class="shrink-0"
      >
        I can help
      </a>
    } @else {
      <app-status-badge [status]="closedStatus()" />
    }
  </div>
</article>
