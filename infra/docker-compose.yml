services:
  caddy:
    build:
      context: ..
      dockerfile: ./infra/services/caddy/Dockerfile
    container_name: caddy
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
      - "8443:443/udp"
    volumes:
      - ../backend/services/caddy:/etc/caddy:ro

  frontend:
    build:
      context: ../frontend/app
      dockerfile: ../../infra/services/frontend/Dockerfile
    container_name: frontend-angular
    restart: unless-stopped
    volumes:
      - ../frontend/app:/app
      - frontend_node_modules:/app/node_modules

  postgres:
    build:
      context: ../backend/services/db
      dockerfile: ../../../infra/services/db/Dockerfile
    container_name: postgres
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../backend/services/api
      dockerfile: ../../../infra/services/api/Dockerfile
    container_name: api
    restart: unless-stopped
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy

  orm:
    build:
      context: ../backend/services/orm
      dockerfile: ../../../infra/services/orm/Dockerfile
    container_name: orm
    restart: unless-stopped
    ports:
      - "4983:4983" # If you need to access Drizzle Studio just go to local.drizzle.studio
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy


volumes:
    frontend_node_modules:
    postgres_data: