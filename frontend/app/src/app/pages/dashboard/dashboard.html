<div class="flex flex-col gap-4">
<app-header-app class="lg:hidden"></app-header-app>
    <section class="flex items-center justify-between gap-2">
        <select
            (change)="onGroupFilterChange($event)"
            class="flex h-10 min-w-40 flex-1 items-center gap-3 rounded-card bg-card px-3 shadow-card cursor-pointer"
        >
            @if (errorMessage()) {
                <option disabled selected>{{ errorMessage() }}</option>
            } @else {
                <option value="">All my groups</option>
                @for (group of groups(); track group.id) {
                    <option [value]="group.id">{{ group.name }}</option>
                } @empty {
                    <option disabled>No groups yet</option>
                }
            }
        </select>

        <a
            routerLink="/app/groupParameter"
            aria-label="Settings"
            class="flex h-10 w-16 shrink-0 items-center justify-center rounded-card bg-card shadow-card"
        >
            <img src="/icons/settings.svg" alt="" class="size-6" />
        </a>
    </section>

    <section class="flex items-center justify-evenly py-1">
        <app-stat-card
            icon="hand-heart"
            [count]="requestCount()"
            label="requests"
            sublabel="from friends"
        />
        <app-stat-card
            tone="success"
            icon="bag-heart"
            [count]="offerCount"
            label="help offers"
            sublabel="recent"
        />
    </section>

    <section class="flex flex-1 flex-col gap-5">
        <div class="flex items-start justify-between px-8">
            <button
                type="button"
                (click)="selectTab('requests')"
                class="border-b-2 px-2 pb-1 text-xs font-bold tracking-tight cursor-pointer"
                [ngClass]="
                    activeTab() === 'requests'
                        ? 'border-primary text-primary'
                        : 'border-transparent text-strong'
                "
            >
                Group requests
            </button>

            <button
                type="button"
                (click)="selectTab('exchanges')"
                class="border-b-2 px-2 pb-1 text-xs font-bold tracking-tight cursor-pointer"
                [ngClass]="
                    activeTab() === 'exchanges'
                        ? 'border-primary text-primary'
                        : 'border-transparent text-strong'
                "
            >
                My exchanges
            </button>
        </div>

        @if (activeTab() === 'requests') {
            <div class="flex flex-col gap-5">
                @for (request of displayedRequests(); track request.id) {
                    <app-request-card [request]="request" (help)="onHelp($event)" />
                } @empty {
                    <p class="text-center text-sm text-text-secondary">No requests right now.</p>
                }
            </div>
        } @else {
            <div class="flex flex-col gap-3">
                @for (exchange of demoExchanges; track exchange.id) {
                    <app-exchange-row
                        [title]="exchange.title"
                        [subtitle]="exchange.subtitle"
                        [statusLabel]="exchange.statusLabel"
                        [status]="exchange.status"
                        [unread]="exchange.unread"
                        (press)="onExchangePress(exchange)"
                    />
                }
            </div>
        }
    </section>
</div>

@if (fabOpen()) {
    <div (click)="closeFab()" class="fixed inset-0 z-40 bg-black/50"></div>

    <div class="fixed bottom-24 left-1/2 z-50 flex -translate-x-1/2 flex-col items-end gap-3">
        <app-fab-action label="Add an item" tone="object" (pick)="openAddObjectModal()" />
        <app-fab-action label="Add request" tone="request" (pick)="openAddPostModal()" />
        <app-fab-action label="Create group" tone="group" (pick)="openAddGroupModal()" />
    </div>
}
@if (!modalService.activeModal()) {
    <button
        type="button"
        (click)="toggleFab()"
        [attr.aria-label]="fabOpen() ? 'Close menu' : 'Open actions menu'"
        class="fixed bottom-6 left-1/2 z-50 size-15 -translate-x-1/2 cursor-pointer"
    >
        @if (fabOpen()) {
            <img src="/icons/fab-cross.png" alt="" class="size-full" />
        } @else {
            <img src="/icons/fab-add.svg" alt="" class="size-full" />
        }
    </button>
}
