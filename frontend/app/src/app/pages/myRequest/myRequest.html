<app-modal
	title="Offers"
	subtitle="{{ offers().length }} received"
	(closed)="modalService.close()"
>
	<div class="flex flex-col gap-4 p-2 lg:p-6">
		<section class="flex flex-col gap-2 rounded-card bg-primary-surface p-3">
			<p class="text-2xs font-bold uppercase tracking-wide text-text-secondary">Your request</p>
			<h3 class="text-base font-bold text-text">{{ post()?.title }}</h3>
			<div class="flex flex-wrap gap-2">
				@for (tag of requestTags(); track tag.label) {
					<app-tag [label]="tag.label" [icon]="tag.icon" />
				}
			</div>
		</section>
		@if (bannerErrors().length > 0) {
			<app-error-banner>
				@for (msg of bannerErrors(); track msg) {
					<p>{{ msg }}</p>
				}
			</app-error-banner>
		}
		@for (offer of offers(); track offer.id) {
			<app-offer-card
				[type]="offer.objectType"
				[name]="offer.name"
				[group]="offer.group"
				[time]="offer.time"
				[objectName]="offer.objectName"
				[message]="offer.message"
				[state]="offer.state"
				(press)="openConversation(offer.id)"
				(accept)="onAccept(offer.id)"
				(decline)="onDecline(offer.id)"
				(pickUp)="onPickUp(offer.id)"
				(giveBack)="onGiveBack(offer.id)"
			/>
		}
		@empty {
			<p class="text-center text-sm text-text-secondary">No offers yet.</p>
		}
		@if (canCancel()) {
			<div class="flex justify-end">
				<button appButton size="small" variant="secondary" type="button" [disabled]="cancelling()"
					(click)="onCancelRequest()">
					Cancel my request
				</button>
			</div>
		}
	</div>
</app-modal>
