<div [class]="classes">
    <div [class]="imageClasses">
        @if (imageUrl) {
            <img [src]="imageUrl" alt="Item image" class="w-full h-full object-cover" />
        } @else {
            <span class="text-3xl lg:text-[40px] leading-none select-none">{{ emoji }}</span>
        }
    </div>
    <div class="flex flex-col gap-2 p-3 w-full">
        <h3 class="text-base font-bold text-text truncate">{{ name }}</h3>
        <div class="flex justify-between items-center">
            <app-status-badge [status]="status"></app-status-badge>
            <div class="flex items-center gap-3">
                <button
                    type="button"
                    (click)="remove.emit()"
                    class="cursor-pointer hover:text-primary transition-colors"
                >
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        viewBox="160 -840 640 720"
                        fill="currentColor"
                        aria-hidden="true"
                        class="size-4"
                    >
                        <path
                            d="m376-300 104-104 104 104 56-56-104-104 104-104-56-56-104 104-104-104-56 56 104 104-104 104 56 56Zm-96 180q-33 0-56.5-23.5T200-200v-520h-40v-80h200v-40h240v40h200v80h-40v520q0 33-23.5 56.5T680-120H280Zm400-600H280v520h400v-520Zm-400 0v520-520Z"
                        />
                    </svg>
                </button>
                <button
                    type="button"
                    (click)="edit.emit()"
                    class="cursor-pointer hover:text-primary transition-colors"
                >
<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" class="size-4.5">
            <path d="M5 19H6.425L16.2 9.225L14.775 7.8L5 17.575V19ZM4 21C3.71667 21 3.47933 20.904 3.288 20.712C3.09667 20.52 3.00067 20.2827 3 20V17.575C3 17.3083 3.05 17.054 3.15 16.812C3.25 16.57 3.39167 16.3577 3.575 16.175L16.2 3.575C16.4 3.39167 16.621 3.25 16.863 3.15C17.105 3.05 17.359 3 17.625 3C17.891 3 18.1493 3.05 18.4 3.15C18.6507 3.25 18.8673 3.4 19.05 3.6L20.425 5C20.625 5.18333 20.7707 5.4 20.862 5.65C20.9533 5.9 20.9993 6.15 21 6.4C21 6.66667 20.954 6.921 20.862 7.163C20.77 7.405 20.6243 7.62567 20.425 7.825L7.825 20.425C7.64167 20.6083 7.429 20.75 7.187 20.85C6.945 20.95 6.691 21 6.425 21H4ZM15.475 8.525L14.775 7.8L16.2 9.225L15.475 8.525Z"/>
        </svg>
                </button>
            </div>
        </div>
    </div>
</div>
