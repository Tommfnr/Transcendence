<app-modal
    title="Edit my profile"
    subtitle="What the people close to you will see"
    (closed)="modalService.close()"
>
    <form (submit)="onSubmit($event)" class="flex flex-col gap-4">
        <app-text-field label="Name" [placeholder]="'TODO'" [required]="true"></app-text-field>
        <app-text-field
            label="First name"
            [placeholder]="'TODO'"
            [required]="true"
        ></app-text-field>
        <app-text-field label="Email" [placeholder]="'TODO'" [required]="true"></app-text-field>
        <div class="flex flex-col gap-2">
            <h2 class="text-sm font-medium text-text">Profile picture</h2>
			<p class="font-bold text-complementary">Coming soon</p>
        </div>
		<button appButton block size="large" variant="secondary" type="submit">Save</button>
    </form>
</app-modal>
