<article
  class="flex w-full flex-col overflow-hidden rounded-card bg-card shadow-card"
>
  <div class="flex items-start gap-2 px-2.5 py-1">
    <div class="size-10 shrink-0 rounded-full bg-muted/50"></div>

    <div class="flex min-w-0 flex-1 flex-col">
      <div class="flex items-center gap-2.5 px-0.5 py-0.5">
        <p class="truncate text-xs font-bold text-text-strong">
          {{ request().authorName }}
          <span class="text-xs font-normal">- </span>
          <span class="text-xs font-normal italic">{{ request().groupName }}</span>
        </p>
        <span class="ml-auto shrink-0 text-2xs font-light tracking-[-0.2px] text-text-strong">
          {{ request().timeAgo }}
        </span>
      </div>

      <div class="flex h-13 flex-col gap-1 overflow-hidden px-0.5">
        <h3 class="truncate text-xs font-bold text-text-strong">{{ request().title }}</h3>
        <p class="line-clamp-2 text-xs text-text">{{ request().description }}</p>
      </div>
    </div>
  </div>

  <div class="flex h-[30px] items-center justify-between px-2">
    <div class="flex items-center gap-2">
      @for (tag of request().tags; track tag.label) {
        <span class="flex items-center gap-1 rounded-sm bg-complementary/15 px-2 py-1">
          <img
            [src]="'/icons/' + tag.icon + '.svg'"
            [class]="tag.icon === 'tag' ? 'size-2.5' : 'size-3'"
            alt=""
          />
          <span class="whitespace-nowrap text-2xs tracking-[-0.18px] text-text-strong">
            {{ tag.label }}
          </span>
        </span>
      }
    </div>

    <a
      routerLink="/app/iCanHelp"
      (click)="help.emit(request())"
      appButton
      size="xsmall"
      class="shrink-0"
    >
      Je peux aider
    </a>
  </div>
</article>
