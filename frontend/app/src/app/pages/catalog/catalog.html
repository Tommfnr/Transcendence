<main class="mx-auto flex w-full max-w-[390px] flex-1 flex-col gap-4 px-3 pb-10">
    <div class="mx-auto flex justify-between items-center w-full">
        <div class="mx-auto flex items-center w-full">
            <h1 class="truncate text-lg font-bold text-strong">Catalog</h1>
            <h3 class="text-xs ml-[2%] text-gray-500/80">{{ objectsCount() }} {{ objectsCount() > 1 ? 'items' : 'item' }}</h3>
        </div>
        <a appButton (click)="openAddObjectModal()" variant="primary" size="small" class="self-end truncate">Add item</a>
    </div>

    <app-text-field placeholder="Rechercher..." typeField="search" [(value)]="searchTerm"></app-text-field>
    <div class="flex flex-wrap gap-2 mt-2">
        @for (cat of categories; track cat.label) {
            <app-chip
                [label]="cat.label"
                [emoji]="cat.emoji"
                [selected]="cat.label === activeCategory()"
                (pick)="activeCategory.set(cat.label)"
                tone="white"
            />
        }
    </div>

    <div class="grid grid-cols-2 gap-3">
        @for (object of searchObjects(); track object.id) {
            <app-object-card
                [name]="object.name"
                [status]="object.isAvailable ? 'available' : 'lent'"
                (edit)="modalService.openEditObject(object.id)"
                (remove)="deleteObject(object.id)"
            ></app-object-card>
        } @empty {
            <p class="col-span-2">No objects match your search/filter.</p>
        }
    </div>
</main>
