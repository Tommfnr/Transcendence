<div class="flex flex-col gap-1">
	@if (label) {
		<label [for]="id" class="text-sm font-medium text-text">
			{{ label }}
			@if (required)
			{
				<span class="text-error" aria-hidden="true">*</span>
			}
		</label>
	}
	<input [id]="id" 
	[type]="typeField" 
	[placeholder]="placeholder" 
	[value]="value" 
	(input)="onInput($event)" 
	[class]="classes"/>
</div>
