<app-modal [title]="isEditMode() ? 'Edit Object' : 'Add Object'" (closed)="onCancel()">
  <h1>Share your items to friends and family</h1>
  <app-text-field
    tone="white"
    label="Item name"
    placeholder="Ex: Driller, Bike..."
    typeField="text"
	[required]="true"
  ></app-text-field>
  <div class="gap-2 align-stretch">
    <h2>Category</h2>

    @for (cat of categories; track cat.label) {
      <app-chip
        [label]="cat.label"
        [emoji]="cat.emoji"
        [selected]="cat.label === activeCategory()"
        (pick)="activeCategory.set(cat.label)"
        tone="white"
      />
    }
  </div>

  <div>
    <h2>State</h2>
    @for (state of states; track state.label) {
      <app-chip
        [label]="state.label"
        [selected]="state.label === activeState()"
        (pick)="activeState.set(state.label)"
        tone="white"
      />
    }
  </div>
  <div>
    <app-text-field
      tone="white"
      label="Description (optional)"
      placeholder="Ex: brand, accessories, additional information..."
      typeField="text"
    ></app-text-field>
  </div>
    <app-button size="large" align-self="stretch">Add Item</app-button>
