<button type="button" (click)="pick.emit()" [class]="classes()">
    <div class="flex h-14 w-full items-center justify-center bg-[linear-gradient(rgba(255,255,255,0.5),rgba(255,255,255,0.9)),url(/img/bg.png)] bg-cover bg-center lg:h-20">
        @if (imageUrl()) {
            <img [src]="imageUrl()" [alt]="name()" class="h-full w-full object-cover" />
        } @else {
            <span class="text-2xl lg:text-3xl leading-none select-none">{{ emoji() }}</span>
        }
    </div>
    <div class="w-full bg-card p-2">
        <p class="truncate text-sm font-bold">{{ name() }}</p>
    </div>
</button>
