<main class="mx-auto flex w-full max-w-[390px] flex-1 flex-col gap-4 px-3 pb-10">
    <h1>Page: Catalog</h1>
    <a routerLink="/app/editAddObject" class="text-primary underline">EditAddObject</a>
    <app-text-field placeholder="Ex: Driller, Bike..."></app-text-field>
    <div class="flex flex-wrap gap-2 mt-2">
        @for (cat of categories; track cat.label) {
            <app-chip
                [label]="cat.label"
                [emoji]="cat.emoji"
                [selected]="cat.label === activeCategory()"
                (pick)="activeCategory.set(cat.label)"
                tone="white"
            />
        }
    </div>

    <div class="grid grid-cols-2 gap-3">
        @for (object of filteredObjects(); track object.id) {
            <app-object-card
                [name]="object.name"
                [status]="object.isAvailable ? 'available' : 'lent'"
                (edit)="modalService.openEditObject(object.id)"
            ></app-object-card>
        } @empty {
            <p class="col-span-2">No objects in this category.</p>
        }
    </div>
</main>
