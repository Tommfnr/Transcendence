services:
  caddy:
    build:
      context: ..
      dockerfile: ./infra/services/caddy/Dockerfile
    container_name: caddy
    restart: unless-stopped
    ports:
      - "8443:443"
      - "8443:443/udp"
    volumes:
      - ../backend/services/caddy:/etc/caddy:ro

  frontend:
    build:
      context: ../frontend/app
      dockerfile: ../../infra/services/frontend/Dockerfile
    container_name: frontend-angular
    restart: unless-stopped
    volumes:
      - ../frontend/app:/app
      - frontend_node_modules:/app/node_modules

  postgres:
    build:
      context: ../backend/services/db
      dockerfile: ../../../infra/services/db/Dockerfile
    container_name: postgres
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../backend/services/api
      dockerfile: ../../../infra/services/api/Dockerfile
      additional_contexts:
        shared: ../backend
    container_name: api
    restart: unless-stopped
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    build:
      context: ../backend/services/gateway
      dockerfile: ../../../infra/services/gateway/Dockerfile
      additional_contexts:
        shared: ../backend
    container_name: gateway
    restart: unless-stopped
    env_file:
      - ../.env

  auth:
    build:
      context: ../backend/services/auth
      dockerfile: ../../../infra/services/auth/Dockerfile
      additional_contexts:
        shared: ../backend
    container_name: auth
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      EVENT_SUBSCRIBER_URLS: http://objects:3000,http://groups:3000,http://lending:3000
    depends_on:
      postgres:
        condition: service_healthy

  users:
    build:
      context: ../backend/services/users
      dockerfile: ../../../infra/services/users/Dockerfile
      additional_contexts:
        shared: ../backend
    container_name: users
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      AUTH_INTERNAL_URL: http://auth:3000
    depends_on:
      auth:
        condition: service_started

  objects:
    build:
      context: ../backend/services/objects
      dockerfile: ../../../infra/services/objects/Dockerfile
      additional_contexts:
        shared: ../backend
    container_name: objects
    restart: unless-stopped
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy

  groups:
    build:
      context: ../backend/services/groups
      dockerfile: ../../../infra/services/groups/Dockerfile
      additional_contexts:
        shared: ../backend
    container_name: groups
    restart: unless-stopped
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy

  lending:
    build:
      context: ../backend/services/lending
      dockerfile: ../../../infra/services/lending/Dockerfile
      additional_contexts:
        shared: ../backend
    container_name: lending
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      OBJECTS_INTERNAL_URL: http://objects:3000
    depends_on:
      postgres:
        condition: service_healthy
      objects:
        condition: service_started

  orm:
    build:
      context: ../backend/services/orm
      dockerfile: ../../../infra/services/orm/Dockerfile
      additional_contexts:
        shared: ../backend
    container_name: orm
    restart: unless-stopped
    ports:
      - "4983:4983" # If you need to access Drizzle Studio just go to local.drizzle.studio
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy


volumes:
    frontend_node_modules:
    postgres_data: