<app-title-bar leading="back" title="I can help"></app-title-bar>
<div class="flex flex-col flex-1 pt-14 gap-4">
    <section class="flex flex-col gap-3 p-4 bg-card rounded-card">
        <div class="flex gap-3">
            <app-avatar tone="brand"></app-avatar>
            <div class="flex flex-col">
                <p class="font-bold">{{ authorName() }}</p>
                <p class="text-xs text-text-secondary">{{ groupName() }} | {{ timeAgo() }}</p>
            </div>
        </div>
        <h2 class="font-bold text-xl">{{ title() }}</h2>
		<p class="text-sm">{{ description() }}</p>
		<div class="flex gap-2">
			<img src="/icons/calendar.svg" class="size-4" alt="Calendar">
			<p class="text-sm text-text-secondary">{{ dateRangeLabel() }}</p>
			<app-tag [label]="objectType()" icon="tag"></app-tag>
		</div>
    </section>
	<section class="flex flex-col gap-3 p-4 bg-card rounded-card">
		<p class="text-center text-sm">TODO: nbs | neighbours have already offered to help</p>
		<p class="text-xs text-text-secondary text-center">{{ authorName() }} | has chosen / hasn't chosen yet</p>
	</section>
	<a appButton block size="large" variant="secondary" type="button" class="mt-auto" [routerLink]="['/app/offerHelp', postId]"
>I offer my help</a>
</div>
