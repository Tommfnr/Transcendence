<div class="flex flex-col py-6 px-5 mt-4 bg-card rounded-card gap-5 shadow-card">

	<section class="flex flex-col gap-1">
		<h1 class="text-xl font-bold">Welcome back</h1>
		<p class="text-sm text-text-secondary">Log in to see what people close to you need</p>
	</section>
		@if (bannerErrors().length > 0) {
			<div class="banner-error">
				@for (msg of bannerErrors(); track msg) {
					<p>{{ msg }}</p>
				}
			</div>
	}
	<section class="flex flex-col">

		<form (submit)="onSubmit($event)" class="flex flex-col gap-5">
			<div>
				<app-text-field placeholder="john@example.com" label="Username or Email" [formField]="loginForm.identifier"></app-text-field>
				<!-- @if (loginForm.identifier().invalid() && loginForm.identifier().touched()) {
					<div class="error">
						@for (error of loginForm.identifier().errors(); track error.kind) {
							<span>{{ error.message }}</span>
						}
					</div>
				} -->
			</div>
			
			<div>
				<app-text-field typeField="password" placeholder="john@example.com" label="Password" [formField]="loginForm.password"></app-text-field>
<!-- 
				@if (loginForm.password().invalid() && loginForm.password().touched()) {
					<div class="error">
						@for (error of loginForm.password().errors(); track error.kind) {
							<span>{{ error.message }}</span>
						}
					</div>
				} -->
			</div>
			
			<div>
				<label>
					<input type="checkbox" [formField]="loginForm.rememberMe"/>
					Remember me
				</label>
			</div>
			
			<button appButton block size="large" type="submit" variant="primary">Log in</button>
		</form>
	</section>
	
	<!-- <div class="form-debug">
		<h3>Current Form Values:</h3>
		<p>Username or Email: {{ loginForm.identifier().value() }}</p>
		<p>Password: {{ loginForm.password().value() ? '••••••••' : '(empty)' }}</p>
		<p>Remember me: {{ loginForm.rememberMe().value() ? 'Yes' : 'No' }}</p>
	</div> -->
	<div>
		<p class="text-text-secondary text-center">No account yet? <a class="font-bold text-primary" routerLink="/register">Register</a></p>
	</div>
	
</div>
