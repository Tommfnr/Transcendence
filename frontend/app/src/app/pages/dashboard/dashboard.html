  <section class="flex items-center justify-between gap-2 px-3">
    <a
      routerLink="/app/exampleGroupList"
      class="flex h-10 min-w-40 flex-1 items-center gap-3 rounded-sm bg-card px-3 shadow-raised"
    >
      <img src="/icons/all-inclusive.svg" alt="" class="size-4 shrink-0" />
      <span class="text-xs font-bold text-text-strong">Tous mes groupes</span>
      <img src="/icons/chevron-down.svg" alt="" class="size-4 shrink-0" />
    </a>

    <a
      routerLink="/app/groupParameter"
      aria-label="Paramètres"
      class="flex h-10 w-[62px] shrink-0 items-center justify-center rounded-sm bg-card shadow-raised"
    >
      <img src="/icons/settings.svg" alt="" class="size-6" />
    </a>
  </section>

  <section class="flex items-center justify-evenly py-1 ">
	<app-stat-card icon="hand-heart" [count]="requestCount" label="requests" sublabel="from friends" />
	<app-stat-card tone="success" icon="bag-heart" [count]="offerCount" label="help offers" sublabel="recent" />
  </section>

  <section class="flex flex-1 flex-col gap-5 px-3">
    <div class="flex items-start justify-between px-[34px]">
      <button
        type="button"
        (click)="selectTab('requests')"
        class="border-b-2 px-2 pb-1 text-xs font-bold tracking-[-0.24px]"
        [ngClass]="
          activeTab() === 'requests' ? 'border-primary text-primary' : 'border-transparent text-text-strong'
        "
      >
        Demandes
      </button>

      <button
        type="button"
        (click)="selectTab('offers')"
        class="border-b-2 px-2 pb-1 text-xs font-bold tracking-[-0.24px]"
        [ngClass]="
          activeTab() === 'offers' ? 'border-primary text-primary' : 'border-transparent text-text-strong'
        "
      >
        Propositions d'aide
      </button>
    </div>

    <div class="flex flex-col gap-5">
      @for (request of requests(); track request.id) {
        <app-request-card [request]="request" (help)="onHelp($event)" />
      }
    </div>
  </section>

  <button
    type="button"
    aria-label="Nouvelle demande"
    class="fixed bottom-6 left-1/2 size-15 -translate-x-1/2"
  >
    <img src="/icons/fab-add.svg" alt="" class="size-full" />
  </button>
