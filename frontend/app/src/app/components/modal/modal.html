<div (click)="onClose()" class="fixed inset-0 z-50 bg-black/50"></div>

<div
    class="fixed inset-x-0 top-12 z-70 mx-auto w-full max-w-app max-h-[85vh] flex flex-col rounded-card bg-background px-4 pt-4 pb-8 gap-5 lg:max-w-2xl lg:p-6"
>
    <div class="flex items-start justify-between">
        <div>
            <h2 class="text-lg font-bold text-text">{{ title() }}</h2>
            @if (subtitle()) {
                <p class="text-xs text-text-secondary">{{ subtitle() }}</p>
            }
        </div>
        <button
			block
            type="button"
            (click)="onClose()"
            aria-label="Close"
            class="flex size-8 shrink-0 items-center justify-center rounded-full bg-card"
        >
            <img src="/icons/fab-cross.png" alt="" class="size-4 cursor-pointer" />
        </button>
    </div>
    <div class="min-h-0 flex-1 overflow-y-auto">
        <ng-content />
    </div>
</div>
