<app-modal
  [title]="isEditMode() ? 'Edit Object' : 'Add Object'"
  (closed)="onCancel()"
>
  <h1>Share your items to friends and family</h1>
  <form (submit)="onSubmit($event)" class="flex flex-col gap-4">
      <app-text-field
          tone="white"
          label="Item name"
          placeholder="Ex: Driller, Bike..."
          typeField="text"
          [formField]="objectForm.name"
      ></app-text-field>

      <div class="flex flex-col gap-2">
          <h2>Category</h2>
          <div class="flex flex-wrap gap-2">
              @for (cat of categories; track cat.label) {
              <app-chip
                  [label]="cat.label"
                  [emoji]="cat.emoji"
                  [selected]="cat.label === object().type"
                  (pick)="setType(cat.label)"
                  tone="white"
              />
              }
          </div>
      </div>

      <div class="flex flex-col gap-2">
          <h2>State</h2>
          <div class="flex flex-wrap gap-2">
              @for (state of states; track state.label) {
              <app-chip
                  [label]="state.label"
                  [selected]="state.value === object().condition"
                  (pick)="setCondition(state.value)"
                  tone="white"
              />
              }
          </div>
      </div>
      <div>
          <app-text-field
              tone="white"
              label="Description (optional)"
              placeholder="Ex: brand, accessories, additional information..."
              typeField="text"
              [formField]="objectForm.description"
          ></app-text-field>
      </div>

        <app-button block type="submit" variant="primary">
            @if (isEditMode()) { Save Changes } @else { Add Object }
        </app-button>
    </form>
</app-modal>
