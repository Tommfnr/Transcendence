<app-title-bar title="Offer my help" leading="back"></app-title-bar>
<div class="flex flex-col gap-4 pt-14 flex-1">
    <section class="bg-card rounded-card flex p-4 gap-4 shadow-card">
        <app-avatar tone="brand"></app-avatar>
        <div class="flex flex-col gap-1">
            <p class="text-text-secondary text-xs">
                For NAME 's request has really really long name
            </p>
            <p class="font-bold text-sm">Looking for OBJECT</p>
        </div>
    </section>
    <section class="gap-2 flex flex-col">
        <h2 class="text-sm font-bold">
            Pick an item from my catalog
            <span class="text-sm font-light text-alert"> (coming soon)</span>
        </h2>
        <div class="flex gap-4">
            <button
                type="button"
                class="flex flex-1 justify-center bg-card rounded-card p-3 items-center gap-2 shadow-card cursor-pointer transition-shadow hover:shadow-raised"
            >
                <img src="/icons/book.svg" class="size-4" />
                <p class="font-bold">My catalog</p>
            </button>
            <button
                type="button"
                (click)="openAddObjectModal()"
                class="flex flex-1 justify-center rounded-card p-3 items-center gap-2 border-2 border-dashed border-text-secondary/40 cursor-pointer transition-shadow hover:shadow-card"
            >
                <img src="/icons/add.svg" class="size-4" />
                <p>Add an item</p>
            </button>
        </div>
        <p class="text-xs text-text-secondary">Your items in the CATEGORY OF DEMAND</p>
        <div class="flex flex-wrap gap-2">
            @for (item of demoItems; track item.id) {
                <app-object-mini
                    [name]="item.name"
                    [selected]="item.id === selectedObjectId()"
                    (pick)="selectedObjectId.set(item.id)"
                />
            }
        </div>
    </section>
    <section>
        <app-text-field
            multiline
            label="Message (optional)"
            placeholder="E.g. I can drop it off Saturday morning, I also have concrete bits…"
        ></app-text-field>
    </section>
    <button appButton block variant="secondary" type="button" size="large" class="mt-auto">
        Send my offer
    </button>
</div>
