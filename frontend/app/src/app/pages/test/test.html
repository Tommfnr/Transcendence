<span class="text-sm font-bold">Chips</span>
<div class="flex flex-wrap gap-2 mt-2">
    @for (cat of categories; track cat.label) {
        <app-chip
            [label]="cat.label"
            [emoji]="cat.emoji"
            [selected]="cat.label === activeCategory()"
            (pick)="activeCategory.set(cat.label)"
            tone="white"
        />
    }
</div>

<span class="text-sm font-bold">Text field</span>
<div class="flex flex-wrap">
    <app-text-field
        tone="complementary"
        label="Username"
        placeholder="Type something..."
        typeField="text"
        (valueChange)="username = $event"
    />

    <p class="text-sm">
        You have typed:
        {{ username }}
    </p>
</div>
