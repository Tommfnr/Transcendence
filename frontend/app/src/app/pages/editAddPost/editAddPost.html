<app-modal
    [title]="isEditMode() ? 'Edit your request' : 'Make a request'"
    subtitle="Ask the people close to you for an item"
    (closed)="onCancel()"
>
    <form (submit)="onSubmit($event)" class="flex flex-col flex-1 px-1 gap-4">
        @if (bannerErrors().length > 0) {
            <div class="rounded border border-red-500 bg-red-50 p-3 text-red-700">
                @for (msg of bannerErrors(); track msg) {
                    <p>{{ msg }}</p>
                }
            </div>
        }
        @if (isEditMode()) {
            <h1>Edit Post</h1>
        } @else {
            <div class="flex flex-col gap-2">
                <p class="text-sm font-medium text-text">Share with</p>
                <app-select-pill tone="neutral" [label]="groupsLabel()">
                    <button
                        type="button"
                        (click)="toggleAllGroups()"
                        class="flex w-full items-center gap-3 rounded-card px-3 py-2 text-left text-sm hover:bg-background"
                    >
                        <span [class]="checkboxClasses(allSelected())">
                            @if (allSelected()) {
                                ✓
                            }
                        </span>
                        All my groups
                    </button>
                    <div class="h-px bg-muted"></div>
                    <div class="max-h-56 overflow-y-auto">
                        @for (group of myGroups(); track group.id) {
                            <button
                                type="button"
                                (click)="toggleGroup(group.id)"
                                class="flex w-full items-center gap-3 rounded-card px-3 py-2 text-left text-sm hover:bg-background"
                            >
                                <span [class]="checkboxClasses(selectedGroupIds().has(group.id))">
                                    @if (selectedGroupIds().has(group.id)) {
                                        ✓
                                    }
                                </span>
                                {{ group.name }}
                            </button>
                        }
                    </div>
                </app-select-pill>
            </div>
        }

        <app-text-field
            label="Item"
            placeholder="E.g. Drill, Raclette, Bike…"
            [formField]="postForm.title"
        ></app-text-field>

        <section class="flex gap-4">
            <div class="flex flex-1 flex-col gap-1">
                <label for="post-from" class="text-2xs font-bold text-text-secondary">From</label>
                <input
                    id="post-from"
                    type="date"
                    [formField]="postForm.fromDate"
                    class="w-full rounded-card border border-text-secondary bg-card px-4 py-2 text-sm text-text focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary"
                />
            </div>

            <div class="flex flex-1 flex-col gap-1">
                <label for="post-to" class="text-2xs font-bold text-text-secondary">To</label>
                <input
                    id="post-to"
                    type="date"
                    [formField]="postForm.toDate"
                    class="w-full rounded-card border border-text-secondary bg-card px-4 py-2 text-sm text-text focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary"
                />
            </div>
        </section>

        <div class="flex flex-col gap-2">
            <p class="text-sm font-medium text-text">Category</p>
            <div class="flex flex-wrap gap-2">
                @for (cat of categories; track cat.label) {
                    <app-chip
                        [label]="cat.label"
                        [emoji]="cat.emoji"
                        [selected]="cat.label === postForm.objectType().value()"
                        (pick)="setObjectType(cat.label)"
                        tone="white"
                    />
                }
            </div>
        </div>

        <app-text-field
            multiline
            rows="3"
            label="Description (optional)"
            placeholder="What do you need it for?"
            [formField]="postForm.description"
        ></app-text-field>

                            {{ group.name }}

        @if (isEditMode()) {
            <button
                appButton
                block
                size="large"
                type="submit"
                variant="secondary"
                [disabled]="postForm().invalid()"
            >
                Save Changes
            </button>
        } @else {
            <button
                appButton
                block
                size="large"
                variant="secondary"
                type="submit"
                [disabled]="selectedGroupIds().size === 0 || postForm().invalid()"
            >
                Send the request
            </button>
        }
    </form>
</app-modal>
