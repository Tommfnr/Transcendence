<header class="mx-auto flex h-12 w-full max-w-[390px] items-center gap-4 px-4">
    <a routerLink="/app" aria-label="Home" class="size-10 shrink-0">
        <img src="/icons/logo-invisible-background.svg" alt="" class="size-10 shrink-0" />
    </a>
    <div class="min-w-0 flex-1">
        <p class="truncate text-lg font-bold text-strong">Hello {{ userName() }}</p>
        <p class="truncate text-2xs text-strong">Together, let's help the people close to us</p>
    </div>

    <button type="button" aria-label="Notifications" class="shrink-0">
        <img src="/icons/notification.svg" alt="" class="size-6" />
    </button>

    <a
        routerLink="/app/profile"
        aria-label="Profile"
        class="size-10 shrink-0 rounded-full bg-primary/50"
    ></a>
</header>
