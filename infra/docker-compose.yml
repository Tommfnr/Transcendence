services:
  caddy:
    build:
      context: ..
      dockerfile: ./infra/services/caddy/Dockerfile
    container_name: caddy
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
      - "8443:443/udp"
    volumes:
      - ../backend/services/caddy:/etc/caddy:ro

  frontend:
    build:
      context: ../frontend/login_page
      dockerfile: ../../infra/services/frontend/Dockerfile
    container_name: frontend-angular
    restart: unless-stopped
    volumes:
      - ../frontend/login_page:/app
      - frontend_node_modules:/app/node_modules

volumes:
    frontend_node_modules: