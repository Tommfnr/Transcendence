x-node-healthcheck: &node-healthcheck
  test: ["CMD-SHELL", "nc -z 127.0.0.1 3000"]
  interval: 5s
  timeout: 3s
  retries: 12
  start_period: 20s

services:
  caddy:
    build:
      context: ..
      dockerfile: ./infra/services/caddy/Dockerfile
    container_name: caddy
    networks:
      - public
      - proxy
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "8443:443"
      - "8443:443/udp"
    volumes:
      - ../backend/services/caddy:/etc/caddy:ro

  frontend:
    build:
      context: ../frontend/app
      dockerfile: ../../infra/services/frontend/Dockerfile
    container_name: frontend-angular
    networks:
      - proxy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 4200"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 60s
    volumes:
      - ../frontend/app:/app
      - frontend_node_modules:/app/node_modules

  postgres:
    build:
      context: ../backend/services/db
      dockerfile: ../../../infra/services/db/Dockerfile
    container_name: postgres
    networks:
      - db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  gateway:
    build:
      context: ../backend/services/gateway
      dockerfile: ../../../infra/services/gateway/Dockerfile
      additional_contexts:
        shared: ../backend
    container_name: gateway
    networks:
      - proxy
      - backend
    restart: unless-stopped
    healthcheck: *node-healthcheck
    environment:
      AUTH_SERVICE_URL: http://auth:3000
      USERS_SERVICE_URL: http://users:3000
      OBJECTS_SERVICE_URL: http://objects:3000
      GROUPS_SERVICE_URL: http://groups:3000
      LENDING_SERVICE_URL: http://lending:3000
      POSTS_SERVICE_URL: http://posts:3000
      CHATS_SERVICE_URL: http://chats:3000
    depends_on:
      auth:
        condition: service_healthy
      users:
        condition: service_healthy
      objects:
        condition: service_healthy
      groups:
        condition: service_healthy
      lending:
        condition: service_healthy
      posts:
        condition: service_healthy
      chats:
        condition: service_healthy
    volumes:
      - ../docs:/app/docs:ro

  auth:
    build:
      context: ../backend/services/auth
      dockerfile: ../../../infra/services/auth/Dockerfile
      additional_contexts:
        shared: ../backend
    container_name: auth
    networks:
      - backend
      - db
    restart: unless-stopped
    healthcheck: *node-healthcheck
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      EVENT_SUBSCRIBER_URLS: http://objects:3000,http://groups:3000,http://lending:3000,http://posts:3000,http://chats:3000
    depends_on:
      postgres:
        condition: service_healthy

  users:
    build:
      context: ../backend/services/users
      dockerfile: ../../../infra/services/users/Dockerfile
      additional_contexts:
        shared: ../backend
    container_name: users
    networks:
      - backend
    restart: unless-stopped
    healthcheck: *node-healthcheck
    environment:
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      AUTH_INTERNAL_URL: http://auth:3000
    depends_on:
      auth:
        condition: service_healthy

  objects:
    build:
      context: ../backend/services/objects
      dockerfile: ../../../infra/services/objects/Dockerfile
      additional_contexts:
        shared: ../backend
    container_name: objects
    networks:
      - backend
      - db
    restart: unless-stopped
    healthcheck: *node-healthcheck
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      AUTH_INTERNAL_URL: http://auth:3000
      EVENT_SUBSCRIBER_URLS: http://lending:3000
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_healthy

  groups:
    build:
      context: ../backend/services/groups
      dockerfile: ../../../infra/services/groups/Dockerfile
      additional_contexts:
        shared: ../backend
    container_name: groups
    networks:
      - backend
      - db
    restart: unless-stopped
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    healthcheck: *node-healthcheck
    depends_on:
      postgres:
        condition: service_healthy

  lending:
    build:
      context: ../backend/services/lending
      dockerfile: ../../../infra/services/lending/Dockerfile
      additional_contexts:
        shared: ../backend
    container_name: lending
    networks:
      - backend
      - db
    restart: unless-stopped
    healthcheck: *node-healthcheck
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      OBJECTS_INTERNAL_URL: http://objects:3000
      POSTS_INTERNAL_URL: http://posts:3000
      GROUPS_INTERNAL_URL: http://groups:3000
    depends_on:
      postgres:
        condition: service_healthy
      objects:
        condition: service_healthy
      posts:
        condition: service_healthy

  posts:
    build:
      context: ../backend/services/posts
      dockerfile: ../../../infra/services/posts/Dockerfile
      additional_contexts:
        shared: ../backend
    container_name: posts
    networks:
      - backend
      - db
    restart: unless-stopped
    healthcheck: *node-healthcheck
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      GROUPS_INTERNAL_URL: http://groups:3000
      EVENT_SUBSCRIBER_URLS: http://lending:3000
    depends_on:
      postgres:
        condition: service_healthy
      groups:
        condition: service_healthy

  chats:
    build:
      context: ../backend/services/chats
      dockerfile: ../../../infra/services/chats/Dockerfile
      additional_contexts:
        shared: ../backend
    container_name: chats
    networks:
      - backend
      - db
    restart: unless-stopped
    healthcheck: *node-healthcheck
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      AUTH_INTERNAL_URL: http://auth:3000
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_healthy

  drizzle-gateway:
    build: ./services/orm
    container_name: drizzle-gateway
    networks:
      - public
      - db
    restart: unless-stopped
    environment:
      MASTERPASS: ${MASTERPASS:?MASTERPASS is not set}
    ports:
      - "127.0.0.1:4983:4983"
    volumes:
      - drizzle_gateway_data:/app
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    build:
      context: ../infra/services/prometheus
      dockerfile: ./Dockerfile
    container_name: prometheus
    networks:
      - backend
      - monitoring
    restart: unless-stopped
    volumes:
    - prometheus-data:/prometheus

  grafana:
    build:
      context: ../infra/services/grafana
      dockerfile: ./Dockerfile
    container_name: grafana
    networks:
      - proxy
      - monitoring
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER
      - GF_SECURITY_ADMIN_PASSWORD
      - GF_SERVER_ROOT_URL
      - GF_SERVER_SERVE_FROM_SUB_PATH
    depends_on:
      - prometheus

  node-exporter:
    build:
      context: ../infra/services/node-exporter
      dockerfile: ./Dockerfile
    container_name: node-exporter
    networks:
      - monitoring
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro

networks:
  public:
  proxy:
    internal: true
  backend:
    internal: true
  db:
    internal: true
  monitoring:
    internal: true

volumes:
    frontend_node_modules:
    postgres_data:
    drizzle_gateway_data:
    prometheus-data:
