<header [class]="classes">
    <div class="mx-auto flex h-12 w-full max-w-[390px] items-center justify-between px-4">
        <div [class]="headingClasses">
            @switch (leading) {
                @case ('avatar') {
                    <app-avatar tone="brand"> </app-avatar>
                }
                @case ('back') {
                    <button
                        type="button"
                        (click)="backClick.emit()"
                        aria-label="Back"
                        class="cursor-pointer px-1 py-1"
                    >
                        <img src="/icons/arrow-back.svg" alt="" class="size-6 shrink-0" />
                    </button>
                }
            }
            <h1 class="text-2xl font-bold text-text truncate">{{ title }}</h1>
            @if (meta) {
                <span class="text-sm text-text-secondary shrink-0">{{ meta }}</span>
            }
        </div>
        <a routerLink="/app" aria-label="Home" class="cursor-pointer">
            <img src="/icons/logo-invisible-background.svg" alt="" class="size-12 shrink-0" />
        </a>
    </div>
</header>
