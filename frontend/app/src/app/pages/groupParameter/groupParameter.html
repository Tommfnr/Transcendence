<app-title-bar title="My groups" leading="back" [meta]="groupData().length + (groupData().length > 1 ? ' groups' : ' group')"></app-title-bar>

<div class="flex flex-col gap-4 pt-12 lg:pt-6">
	<div class="hidden lg:flex items-baseline justify-between">
		<h1 class="text-lg font-bold">My groups</h1>
		<span>{{groupData().length }} {{groupData().length > 1 ? ' groups' : ' group'}}</span>
	</div>
	<div class="flex flex-col gap-4 lg:grid lg:grid-cols-2">

		@for (group of groupData(); track group.id) {
			<app-group-card [name]="group.name" [memberCount]="memberCounts()[group.id] ?? 0" [role]="roleLabel(group)" (settings)="modalService.openEditGroup(group.id)"></app-group-card>
		} @empty {
			<p>No groups yet.</p>
		}
	</div>

                @if (group.description) {

                }

    <button
        appButton
        block
        size="large"
        variant="secondary"
        type="button"
        (click)="modalService.openAddGroup()"
        class="lg:w-auto lg:self-start"
    >
        Create a group
    </button>
</div>
