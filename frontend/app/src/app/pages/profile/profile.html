<app-title-bar title="My profile" leading="back"></app-title-bar>

<h1 class="hidden text-lg font-bold lg:block">My profile</h1>
<div class="flex flex-col gap-6 pt-12 lg:pt-8 lg:grid lg:grid-cols-2 lg:gap-8">
    <div class="flex flex-col gap-6">
        <section
            class="flex items-center gap-4 rounded-card bg-[linear-gradient(rgba(255,255,255,0.75),rgba(255,255,255,0.75)),url(/img/bg.png)] bg-cover bg-center border border-primary-surface p-4"
        >
            <app-avatar size="lg" kind="mySelf"></app-avatar>
            <div class="min-w-0">
                <p class="truncate text-lg font-bold text-text">{{ user()?.username }}</p>
                <p class="truncate text-xs text-text-secondary">{{ user()?.email }}</p>
            </div>
        </section>
        <app-list-row
            label="Email address"
            [value]="user()?.email ?? ''"
            (edit)="openEditProfileModal()"
        ></app-list-row>
        <section class="flex flex-col gap-2">
            <h2 class="text-2xs font-semibold tracking-tight text-text-secondary">IDENTITY</h2>
            <app-list-row
                editable
                label="Username"
                [value]="user()?.username ?? ''"
                (edit)="openEditProfileModal()"
            ></app-list-row>
            <app-list-row
                editable
                label="Profile picture"
                [value]="'Edit'"
                (edit)="openEditProfileModal()"
            ></app-list-row>
        </section>
    </div>
    <div class="flex flex-col gap-6">
        <section class="flex flex-col gap-2">
            <h2 class="text-2xs font-semibold tracking-tight text-text-secondary">MY CONTENT</h2>
            <app-list-row
                link="/app/catalog"
                label="Item catalog"
                [value]="objectsCount()"
            ></app-list-row>
            <app-list-row
                link="/app/groupParameter"
                label="My groups"
                [value]="groupsCount()"
            ></app-list-row>
        </section>

        <section class="flex flex-col gap-2">
            <h2 class="text-2xs font-semibold tracking-tight text-text-secondary">ACCOUNT</h2>
            <app-list-row label="User analytics" link="/app/userAnalytics"></app-list-row>
            <app-list-row label="Help and support" link="/app/helpSupport"></app-list-row>
        </section>
    </div>
</div>

<div class="flex flex-col lg:w-fit lg:mx-auto">
	@if (bannerErrors().length > 0) {
		<app-error-banner class="mt-6">
			@for (msg of bannerErrors(); track msg) {
				<p>{{ msg }}</p>
			}
		</app-error-banner>
	}
	<button appButton [block]="true" size="large" variant="secondary" type="button" class="mt-6 lg:self-center" (click)="onLogout()">Log out</button>
	<button appButton [block]="true" size="large" variant="muted" type="button" class="mt-4 hover:bg-alert lg:w-auto lg:self-center" (click)="onDeleteUser()">
		Delete my account
	</button>
</div>
